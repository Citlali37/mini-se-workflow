[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-se-workflow"
version = "0.1.0"
description = "Requirements, design and coding agents with executable acceptance and bounded repair"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
mini-se-workflow = "mini_se_workflow.cli:main"

[tool.setuptools.packages.find]
include = ["mini_se_workflow*"]

[tool.setuptools.package-data]
mini_se_workflow = ["static/*.html", "fixtures/todo_project/*.py", "fixtures/todo_project/*.md"]
