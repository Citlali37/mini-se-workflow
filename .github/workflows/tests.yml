name: Workflow quality checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -X utf8 -m unittest discover -s tests -v
      - run: python -X utf8 -m mini_se_workflow.evaluation --output .ci-output/evaluation.json --run-root .ci-output/runs
      - run: python -X utf8 -m mini_se_workflow.comparison --repeats 1 --output .ci-output/comparison.json --run-root .ci-output/comparison-runs
